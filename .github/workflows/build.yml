name: Build

# Proves the standalone executables actually build and work on every
# platform. This is the only place PyInstaller runs, because the build
# requires network access to fetch it, so this workflow is what stands
# between a broken bundle and a release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Bundle on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"

      # Only the Windows installer needs an external tool. It is installed
      # before the build so a missing compiler is reported as a setup
      # failure rather than surfacing as a confusing build error.
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress

      # --clean matters: a bundle that inherits a file from an earlier run
      # is not reproducible, and the tree checksum below is only meaningful
      # if the output directory started empty.
      - name: Build standalone executable
        run: python packaging/build.py --clean --installer

      # Both install scripts download a .sha256 sidecar next to the artifact
      # and refuse to install anything they cannot verify, so an artifact
      # without one is uninstallable rather than merely unverified. Caught
      # here, this costs a red build instead of a user reporting that the
      # installer downloaded something it would not install.
      - name: Verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(packaging/output/*.tar.xz packaging/output/*.dmg packaging/output/*.exe)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "error: no release artifacts were produced" >&2
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            if [ ! -f "${artifact}.sha256" ]; then
              echo "error: missing checksum sidecar ${artifact}.sha256" >&2
              exit 1
            fi
            echo "ok: $(basename "${artifact}")"
          done

      # The DMG's internal layout is a contract with scripts/install.sh, and
      # no other check covers it: the bundle inside the image can be perfect
      # while the path the installer copies from is not, and that failure only
      # shows up on a user's Mac. Mounting the image here is the one place it
      # can be caught on a build, and running the executable out of it proves
      # the whole path rather than just the directory names.
      - name: Verify DMG layout
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls packaging/output/*.dmg)
          # The same parse as scripts/install.sh's parse_mount_point, whose
          # path this step exists to verify: hdiutil pads its columns with
          # whitespace rather than a dependable tab.
          mount_point=$(hdiutil attach "$dmg" -nobrowse -readonly -mountrandom \
            | grep -o '/Volumes/.*' | head -1 | sed -e 's/[[:space:]]*$//' || true)
          if [ -z "$mount_point" ]; then
            echo "error: hdiutil reported no mount point" >&2
            exit 1
          fi
          trap 'hdiutil detach "$mount_point" -quiet || true' EXIT
          bundle="$mount_point/Smart File Organizer/smart-organizer/smart-organizer"
          if [ ! -d "$mount_point/Smart File Organizer/smart-organizer" ]; then
            echo "error: $dmg does not contain Smart File Organizer/smart-organizer" >&2
            ls -la "$mount_point" >&2
            exit 1
          fi
          "$bundle" --version

      # The behavioural gate. A bundle that starts but cannot watch is the
      # failure this application is most likely to ship, so it is checked
      # explicitly rather than inferred from a successful build.
      - name: Smoke test the frozen binary
        run: python packaging/smoke_test.py packaging/output/smart-organizer

      - name: Report bundle size
        shell: bash
        run: |
          du -sh packaging/output/smart-organizer
          find packaging/output/smart-organizer -type f | wc -l

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: smart-organizer-${{ matrix.os }}
          path: |
            packaging/output/smart-organizer
            packaging/output/*.exe
            packaging/output/*.dmg
            packaging/output/*.tar.xz
            packaging/output/*.sha256
          if-no-files-found: error
          retention-days: 7
